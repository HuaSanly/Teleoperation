debug:
  direct_running_mode: false
grpc:
  server_grpc_ip: "grpc-dev.eifuture.com"
  server_grpc_port: 7777
  use_ssl: true
  device_id: "robot_876"
  robot_generation: 1
  token: "secure"
  rpc_timeout_ms: 5000
  register_retry_sec: 3.0
  heartbeat_sec: 5.0
udp:
  server_udp_ip: "192.168.3.55"
  server_udp_port: 7778
  # server_udp_ip: "192.168.3.14"
  # server_udp_port: 5000
  bind_ip: "0.0.0.0"
  bind_port: 0
  enable_receive: true
  recv_timeout_ms: 100
  max_payload_bytes: 1200
  send:
    nonblocking: true
    # 0 = auto low-latency SO_SNDBUF sized from pacing.bps; set explicitly to override.
    buffer_bytes: 0
  pacing:
    enabled: true
    # legacy = old FIFO + per-packet sleep_until; webrtc_like = priority queue + media-debt pacing.
    mode: "webrtc_like"
    queue_max_bytes: 1200000
    queue_max_packets: 2048
    bps: 60000000
    # WebRTC-like pacing knobs. Small bursts reduce wakeups without returning to large FIFO bursts.
    send_burst_interval_ms: 5
    max_burst_bytes: 45000
    max_debt_ms: 500
    queue_time_limit_ms: 80
    max_drain_multiplier: 2.0
    account_audio: false
    max_packets_per_batch: 64
  fec:
    enabled: true
    table_id: 1
    # FEC 输入帧队列深度. 2 帧过于激进, 运动帧/FEC 瞬时变慢时会优先丢 P 帧;
    # 8 帧约等于 267ms@30fps 的吸收窗口, 后续用 fecwait/udp drop 再压低.
    input_queue_max_frames: 2
  handshake:
    enabled: true
    interval_sec: 1.0
    ping_interval_sec: 5.0
    # peer 超时 (秒), 0 = 禁用 (建立后不主动判定丢失)
    peer_lost_timeout_sec: 0.0
  pose_udp:
    enabled: true
    frame_id:
      hmd: "vr_hmd"
      left_controller: "vr_left_controller"
      right_controller: "vr_right_controller"
      left_aim: "vr_left_aim"
      right_aim: "vr_right_aim"
    publish_euler: true
    publish_buttons: true
    publish_aim: true
video:
  profile: [3840,1080,30]
  device: "/dev/video0"
  pixel_format: "mjpeg"
  v4l2:
    buffer_count: 4.
    warmup_drop_frames: 30
  converter:
    compute: "vic"  # Use VIC with global mutex serialization
  decoder:
    buffer_pool_size: 4
    output_plane_buffers: 6
    capture_plane_buffers: 4
  encoder:
    # 视频编码 (H.264/H.265). 切换 codec 双方通过 VideoConfig 协商, VR 端无需改.
    codec: "h264"
    # 平均目标码率 (bps).
    bitrate: 30000000
    # I 帧间隔 (GOP 长度, 帧). 与 idr_interval 对齐时, 每个 I 帧都是可独立恢复点.
    i_frame_interval: 5
    # IDR 帧间隔 (帧). IDR 是能独立解码的 I 帧, 丢包后从 IDR 重新对齐.
    # 当前链路依赖高频 IDR 快速恢复运动画面的参考帧/丢包损伤; 30fps 下 5 ≈ 167ms 一个恢复点.
    idr_interval: 5
    # NVENC 冷启动预热窗口 (ms): 期间编码输出全部丢弃, 避免 backlog 污染下游. 0=关.
    warmup_ms: 300
    # 按需触发 IDR: 每 N 帧强制一次. 0=关 (仅靠 idr_interval).
    force_idr_every_n: 0
    # NVENC 最大性能模式 (锁定时钟). 默认 true.
    max_perf_mode: true

    # ---- Low-level NVENC tuning (手动调参) ----
    # 码控模式: vbr | cbr
    rate_control: "cbr"
    # 峰值码率 (bps). CBR 下基本不生效; 保留字段用于切 VBR 时对比.
    peak_bitrate: 80000000
    # VBV (virtual buffer) 大小 (bytes). 这是 NVIDIA NvVideoEncoder API 的单位.
    # 保留当前值用于对比; 后续若 sendq/udp drop 仍高, 再单独调这个变量.
    virtual_buffer_size: 2000000
    # NVENC 预设: ultrafast | fast | medium | slow.
    hw_preset: "ultrafast"
    # 参考帧数. 低延迟通常 = 1.
    num_reference_frames: 1
    # B 帧数. 低延迟必须 = 0 (B 帧引入重排序延迟).
    num_b_frames: 0
    # 在每个 IDR 前重新插入 SPS/PPS, 便于丢包后快速恢复.
    insert_sps_pps_at_idr: true
    # 切片级输出 (true = 每切片单独 dequeue). Jetson NVENC 仍整帧投递, 通常无收益.
    slice_level_encode: false
    # 切片数. 多切片 = 抗丢包更好, 但 FEC/打包开销增加.
    num_slices: 1
    # H.264 POC 类型 (0/1/2). 2 = 隐式, 低延迟推荐.
    poc_type: 2
    # 在每帧前插入 AUD NAL.
    insert_aud: false
    # 编码帧率覆盖. 0 = 用 profile 帧率.
    framerate_override: 0
    # NVENC 输入 plane buffer 数. 官方 01_video_encode DMABUF 输出面默认 10; 这里先用 6 减少运动帧背压.
    output_plane_buffers: 6
    # NVENC 输出 plane buffer 数. 官方 capture 默认 6; 这里对齐官方默认.
    capture_plane_buffers: 6
    # QP 钳制范围 (0 = 不限, 由编码器自动).
    qp_range:
      i_min: 0
      i_max: 0
      p_min: 0
      p_max: 0

    # 旁路: slice intra-refresh (R5/R6 实验时再开). 默认 false.
    intra_refresh:
      enabled: false
      interval_slices: 1
    # 旁路: 把 IDR 间隔覆盖为 N 秒 (用于长 GOP 实验). 默认 false.
    low_freq_idr:
      enabled: false
      interval_sec: 3
  eye_image:
    enabled: true
    output_width: 640
    output_height: 360
    # eye_image is now zero-copy from the encoder's NV12 buffer, but it still
    # consumes VIC/CPU for crop/scale/RGB publish. Limit auxiliary publish rate
    # so the main video path remains real-time. 0 = unlimited.
    max_fps: 60
    left_topic: "data/left_eye_image_raw"
    right_topic: "data/right_eye_image_raw"
  undistort:
    # 双目去畸变 + 立体校正 (VPI CUDA Remap, 单次对 SBS 大图做 remap)
    # enabled=false 时整段 stage 跳过, 零开销; 开启后链路:
    #   converter (NV12) -> undistorter (NV12) -> encoder / eye_image
    enabled: false
    # 标定参数文件 (相对 package share 或绝对路径). 内容格式见
    # config/calibration_stereo.yaml.example.
    calib_file: "config/calibration_stereo.yaml"
    # 严格模式: yaml 缺失或解析失败时 init 直接失败 (上层会自动旁路).
    # 调试时设为 false 可让模块用恒等映射跑起来.
    require_calibration: true
audio:
  enabled: true
  uplink_enabled: true
  downlink_enabled: false
  aec_enabled: false
  capture_device: "plughw:CARD=MIC,DEV=0"
  playback_device: "plughw:CARD=MIC,DEV=0"
  # Opus / PCM 参数 (默认值与代码一致, 改动需双方对齐)
  sample_rate: 48000
  channels: 1
  frame_duration_ms: 20
  samples_per_channel: 960
  bitrate_bps: 64000
  opus_inband_fec_enabled: true
  opus_dtx_enabled: false

    
    
