/teleop_robot_bridge:
  ros__parameters:
    server_ip: "grpc-pro.eifuture.com"
    server_port: 7777
    use_ssl: true
    device_id: "007"
    token: "secure"
    subscribe_vr_pose_flag: false

    udp_ip: "162.14.226.58"
    udp_port: 7778

    # ---------------- Pose UDP receiver (VR pose datagram) ----------------
    # Receives Type=0x02 PoseDataPacket per doc/POSE_DATAGRAM_PROTOCOL.md
    # and publishes ROS topics.
    #
    # Topics:
    # - /teleop/pose/hmd, /teleop/pose/left_controller, /teleop/pose/right_controller (geometry_msgs/PoseStamped)
    # - /teleop/euler/* (geometry_msgs/Vector3Stamped, degrees) when flags&0x01 and publish_euler
    # - /teleop/controller/*_joy (sensor_msgs/Joy) when flags&0x04 and publish_buttons
    # - /teleop/aim/* (PoseStamped/Bool/Float32) when flags&0x02 and publish_aim
    pose_udp.enabled: true
    pose_udp.bind_ip: "0.0.0.0"
    pose_udp.bind_port: 7780
    # Optional source whitelist (IPv4 string). Empty means accept any sender.
    pose_udp.allowed_remote_ip: ""
    pose_udp.recv_timeout_ms: 100
    pose_udp.qos.depth: 10
    # frame_id for published messages
    pose_udp.frame_id.hmd: "vr_hmd"
    pose_udp.frame_id.left_controller: "vr_left_controller"
    pose_udp.frame_id.right_controller: "vr_right_controller"
    pose_udp.frame_id.left_aim: "vr_left_aim"
    pose_udp.frame_id.right_aim: "vr_right_aim"
    pose_udp.publish_euler: true
    pose_udp.publish_buttons: true
    pose_udp.publish_aim: true

    # ---------------- Unified logging (optional file sink) ----------------
    # Console logging still goes through RCLCPP; this section additionally
    # enables selective log persistence into a single local file.
    # NOTE: Keep these as dot-separated parameter names to match MainNode's
    # declare_parameter("logging.file.*") calls.
    logging.file.enabled: true
    # Directory (recommended). If you provide a file path, its parent directory will be used.
    # On each startup, a new file will be created: trb_<YYYYmmdd_HHMMSS>_<pid>.log
    logging.file.path: "/home/eierobot/dev_ws/src/teleop_robot_bridge/logs"
    # Supported topics:
    # - udp_iframe: I-frame size + packet counts
    # - udp_header_once: UDP packet headers (up to udp.header_log.max_packets; 0 means unlimited)
    # - udp_handshake: UDP HELLO/ACK logs
    # - udp_frame_end: per-frame summary logs
    logging.file.topics: ["udp_iframe"]

    # ---------------- UDP header dump (debug) ----------------
    # Maximum number of UDP packet headers to write to file when udp_header_once is enabled.
    # 0 means unlimited.
    udp.header_log.max_packets: 1500

    # ---------------- UDP send (non-blocking) ----------------
    # Non-blocking send avoids long stalls inside sendto().
    # When enabled, packets may be dropped if kernel tx queue is full (EAGAIN).
    udp.send.nonblocking: false
    # Optional: increase kernel tx buffer to reduce EAGAIN during short bursts.
    udp.send.sndbuf_bytes: 2097152

    # ---------------- UDP stop-after-frames (debug / testing) ----------------
    # If enabled and max_frames>0, stop sending after N video frames.
    # The sender prints the cumulative number of successfully sent UDP packets.
    udp.stop_after_frames.enabled: false
    udp.stop_after_frames.max_frames: 1500

    # ---------------- UDP pacing (smooth sending) ----------------
    # Smooths per-frame UDP bursts into an even packet rate.
    # Recommended: set bps slightly above encoder bitrate to cover
    # UDP header overhead and (optional) FEC redundancy.
    udp.pacing.enabled: true
    udp.pacing.bps: 30000000
    # Queue bounds cap worst-case latency when the network stalls.
    # Smaller = lower latency but more drops during stalls.
    udp.pacing.queue_max_packets: 1024
    udp.pacing.queue_max_bytes: 300000

    # ---------------- FEC (low-latency) ----------------
    # V2 FEC is selected by table_id only.
    # NOTE: Current sender implementation supports ONLY:
    # - udp.fec.table_id: 1
    # In this mode, per-frame (Groups, R) are derived from N=TotalFragments
    # by lookup table (N=8..255) in the strategy doc.
    udp.fec.enabled: true
    udp.fec.table_id: 1
    # ---------------- Video ----------------
    # Unified profile: [width, height, framerate]
    video.profile: [3840, 1520, 30]

    # V4L2 capture settings
    video.device: "/dev/video0"
    video.pixel_format: "mjpeg"     # mjpeg|yuyv (extendable)
    # Larger buffer_count increases end-to-end latency roughly by ~buffer_count/frame_rate.
    # For 30fps, 8 buffers can add ~266ms of queueing delay.
    video.v4l2.buffer_count: 3

    # Converter (MJPEG -> NV12 dmabuf)
    # Must be >= typical encoder in-flight depth to avoid reuse hazards.
    video.converter.buffer_pool_size: 8
    # Compute device for NvBufSurfTransform: default|vic|gpu
    # On Jetson, vic is usually the lowest-latency path for colorspace conversion.
    video.converter.compute: "vic"

    # NvBufSurface layout:
    # - dec_layout affects decoder output (YUV422) surfaces
    # - out_layout affects converter output (NV12) surfaces fed to NVENC
    # Notes:
    # - block = block-linear (can be faster for some HW paths)
    # - NVENC input is often most stable/fast with pitch
    video.converter.dec_layout: "block"
    video.converter.out_layout: "pitch"

    # Legacy (kept for backward compatibility): if set, it is treated as decode layout only.
    # video.converter.layout: "pitch"

    # Encoder (NV12 dmabuf -> H264)
    video.encoder.bitrate: 40000000
    # Intra refresh ("I-frame smoothing") + low-frequency IDR:
    # - intra refresh: gradually refreshes the picture across P-frames
    # - low-frequency IDR: provides a clean join/recovery point every N seconds
    video.encoder.intra_refresh.enabled: true
    # NvVideoEncoder::setSliceIntrarefresh(interval_slices). 1 is the strongest refresh.
    video.encoder.intra_refresh.interval_slices: 1
    video.encoder.low_freq_idr.enabled: true
    video.encoder.low_freq_idr.interval_sec: 3

    # These are still applied (and are overridden by low_freq_idr when enabled).
    video.encoder.idr_interval: 90
    video.encoder.idr_interval_gops: 90
    video.encoder.force_idr_every_n: 0
    video.encoder.qp_range_i_min: 10
    video.encoder.qp_range_i_max: 40
    video.encoder.qp_range_p_min: 10
    video.encoder.qp_range_p_max: 40
    video.encoder.output_plane_buffers: 3
    video.encoder.capture_plane_buffers: 3

    # Jetson NvVideoEncoder tuning knobs (optional)
    # Low-latency usually means: no B-frames + small VBV.
    # Note: Some Jetson/L4T versions return EINVAL for V4L2_CID_MPEG_VIDEO_MAX_PERFORMANCE.
    # Keep it off unless you confirm it's supported on your device.
    video.encoder.max_perf_mode: false
    video.encoder.hw_preset: "ultrafast"          # ultrafast|fast|medium|slow|disable|default
    video.encoder.rate_control: "cbr"            # cbr|vbr|cq|default
    video.encoder.peak_bitrate: 40000000         # optional; often = bitrate for CBR
    video.encoder.virtual_buffer_size: 200000    # bytes; start with ~2-4 frames of VBV
    video.encoder.num_reference_frames: 1        # reduce DPB latency
    video.encoder.num_b_frames: 0                # key setting for low latency
    video.encoder.insert_sps_pps_at_idr: 1       # useful for streaming decoders

    # Recording (optional)
    video.recording.enabled: false
    video.recording.output_dir: "/home/eierobot/dev_ws/src/teleop_robot_bridge/H264" 